name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'

jobs:
  go:
    name: Go — build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            services/control-plane/go.sum
            apps/cli/go.sum

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l services apps/cli)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet github.com/genesis-ai-factory/control-plane/... github.com/genesis-ai-factory/cli/...

      # The architecture test is run separately and first: a layering violation
      # should fail fast with an unambiguous message rather than being buried
      # in the full suite output.
      - name: Enforce architecture rules
        run: go test -v github.com/genesis-ai-factory/control-plane/internal/arch

      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out -covermode=atomic github.com/genesis-ai-factory/control-plane/... github.com/genesis-ai-factory/cli/...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Build binaries
        run: make build

  postgres:
    name: Repository conformance — PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: genesis
          POSTGRES_PASSWORD: genesis
          POSTGRES_DB: genesis_test
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 12
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/control-plane/go.sum

      # The same suite that runs against SQLite runs against PostgreSQL, which
      # is what guarantees the two implementations cannot drift apart.
      - name: Run the shared repository suite against PostgreSQL
        env:
          GENESIS_TEST_POSTGRES_DSN: postgres://genesis:genesis@localhost:5432/genesis_test?sslmode=disable
        run: go test -count=1 -v github.com/genesis-ai-factory/control-plane/internal/infra/sqlstore

  desktop:
    name: Desktop — typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  security:
    name: Security — vulnerabilities and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Scan Go dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck github.com/genesis-ai-factory/control-plane/... || true

      - name: Reject committed secrets
        run: |
          # A secret committed once is compromised permanently, so this check
          # blocks the merge rather than reporting after the fact.
          if git grep -nIE '(-----BEGIN [A-Z ]*PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{32})' \
               -- . ':!*_test.go' ':!docs/**'; then
            echo "::error::a credential-shaped string was found in the tree"
            exit 1
          fi

  release:
    name: Cross-compile release binaries
    runs-on: ubuntu-latest
    needs: [go, desktop]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - run: make cross

      - uses: actions/upload-artifact@v4
        with:
          name: genesis-binaries
          path: bin/
          retention-days: 14
